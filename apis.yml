name: Avoice
description: Avoice is an AI-native workspace for architects and engineers that automates the
  non-design work of running an architectural practice. Its AI agents understand drawings,
  specifications, schedules, materials, building codes, and research to generate specs, run
  automated QA/QC quality control on specs and drawings, auto-produce door/window/finish
  schedules and quantities, draft RFIs and submittals for construction administration, and manage
  a client portal alongside searchable detail and material libraries. A Y Combinator Winter 2026
  company, Avoice positions itself as the operating system for architectural practice, with firms
  managing over $300 million in active projects using it across five countries. Avoice publishes no
  public API, SDK, or developer documentation at this time; this profile tracks the company as a
  network lead.
